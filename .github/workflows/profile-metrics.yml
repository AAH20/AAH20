name: Refresh public profile metrics

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh GitHub-backed metrics and portfolio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_metrics.py
      - name: Validate generated artifacts
        run: python -m unittest discover -s tests -v
      - name: Commit refreshed data when changed
        run: |
          if ! git diff --quiet -- data/public-original-repositories.json data/profile-metrics.json assets/profile PORTFOLIO.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/public-original-repositories.json data/profile-metrics.json assets/profile PORTFOLIO.md
            git commit -m "chore: refresh public GitHub profile metrics"
            git push
          fi
